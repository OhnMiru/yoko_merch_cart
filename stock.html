<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Остатки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍓%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#fdeff1;--card:#fff;--ink:#3b0f16;--mute:#8a5a62;--line:#f3cdd2;--accdark:#9c1523;--low:#b5182b;--lowbg:#fde0dc;--head:#fde3e0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#2a0d13;--card:#3a1620;--ink:#fde8ea;--mute:#d3a0a8;--line:#5a2530;--accdark:#ff9a8c;--low:#ff8a7a;--lowbg:#5a1e26;--head:#4a1d28;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:900px;margin:0 auto}
h1{font-size:clamp(26px,5vw,36px);margin:28px 0 4px;color:var(--accdark)}
p{color:var(--mute);margin:0 0 20px}
a{color:var(--accdark)}
.wrap{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--head);color:var(--accdark)}
tr:last-child td{border-bottom:0}
td.q{font-weight:700;font-variant-numeric:tabular-nums}
.low{background:var(--lowbg)}.low td.q{color:var(--low)}
.zero td{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>🍓 Остатки</h1>
  <p>Красным выделены позиции, которые пора допечатать (осталось 3 и меньше). <a href="./">К каталогу</a></p>
  <div class="wrap"><table>
    <thead><tr><th>Позиция</th><th>Фандом</th><th>Вид</th><th>Осталось</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const LOW = 3;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('items.json?t=' + Date.now()).then(r => r.json()).then(d => {
  const l = (d.items || []).slice().sort((a, b) => a.qty - b.qty);
  document.getElementById('rows').innerHTML = l.map(i =>
    `<tr class="${i.qty <= LOW ? 'low' : ''} ${i.qty === 0 ? 'zero' : ''}"><td>${esc(i.name)}</td><td>${esc(i.fandom)}</td><td>${esc(i.type)}</td><td class="q">${esc(i.qty)}</td></tr>`).join('')
    || '<tr><td colspan="4">Пока пусто.</td></tr>';
});
</script>
</body>
</html>
