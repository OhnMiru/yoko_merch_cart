<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Остатки</title>
<style>
:root{--bg:#f3f2f8;--card:#fff;--ink:#1d1b2e;--mute:#6b6880;--line:#dcd9ea;--low:#c62f4b;--lowbg:#fde8ec;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15131f;--card:#1f1c2d;--ink:#eeecf7;--mute:#9a97b0;--line:#34304a;--low:#ff7d94;--lowbg:#3a1d29;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:900px;margin:0 auto}
h1{font-size:clamp(26px,5vw,36px);margin:28px 0 4px}
p{color:var(--mute);margin:0 0 20px}
a{color:inherit}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.q{font-weight:700;font-variant-numeric:tabular-nums}
.low{background:var(--lowbg)}.low td.q{color:var(--low)}
.zero td{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Остатки</h1>
  <p>Красным выделены позиции, которые пора допечатать (осталось 3 и меньше). <a href="./">К каталогу</a></p>
  <div class="wrap"><table>
    <thead><tr><th>Позиция</th><th>Фандом</th><th>Вид</th><th>Осталось</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const LOW = 3;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('items.json?t=' + Date.now()).then(r => r.json()).then(d => {
  const l = (d.items || []).slice().sort((a, b) => a.qty - b.qty);
  document.getElementById('rows').innerHTML = l.map(i =>
    `<tr class="${i.qty <= LOW ? 'low' : ''} ${i.qty === 0 ? 'zero' : ''}"><td>${esc(i.name)}</td><td>${esc(i.fandom)}</td><td>${esc(i.type)}</td><td class="q">${esc(i.qty)}</td></tr>`).join('')
    || '<tr><td colspan="4">Пока пусто.</td></tr>';
});
</script>
</body>
</html>
